spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: jslg
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jslg}
    username: ${DB_USER:jslg}
    password: ${DB_PASSWORD:jslg123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
  web:
    resources:
      static-locations: classpath:/static/

server:
  port: 8080

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration: ${JWT_EXPIRATION:PT8H}
    admin-username: ${ADMIN_USERNAME:coordenador}
    admin-password: ${ADMIN_PASSWORD}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
