services:
  db:
    image: postgres:16
    container_name: jslg-db
    environment:
      POSTGRES_DB: ${DB_NAME:-jslg}
      POSTGRES_USER: ${DB_USER:-jslg}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jslg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jslg} -d ${DB_NAME:-jslg}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: jslg-app
    environment:
      TZ: America/Sao_Paulo
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-jslg}
      DB_USER: ${DB_USER:-jslg}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-coordenador}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT8H}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  jslg-data:
